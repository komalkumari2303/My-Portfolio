<doctype html>
<html>
<head>
<style>
    .box{
        border: 2px solid red;
        display: grid;
        height: 100px;
        width: 100%;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
        
    }    
    .box-1{
        border: 2px solid black;
    }  
    .big-item{
        border: 2px solid pink;
        display: grid;
        height: 300px;
        width: 100%;
        grid-template-columns: 3fr 5fr 2fr;
        
    }
    .box-2{
        border: 2px solid blue;
    }
    .item-container{
        border: 2px solid green;
        display: grid;
        grid-template-columns: 4fr 4fr 4fr 4fr;
        height: 150px;
        width: 100%;
    }
    .box-3{
        border: 2px solid black;
    }
    #k{
        height: 150px;
        border: 2px solid red;
        width: 800px;
        
    }
</style>
</head>
<body>    
<div class="box">
<div class="box-1"></div>    
<div class="box-1"></div>    
<div class="box-1"></div>    
<div class="box-1"></div>    
<div class="box-1"></div>    
<div class="box-1"></div>    
<div class="box-1"></div>    
</div>    
    
<div class="big-item">
<div class="box-2"></div>    
<div class="box-2">
<div id="k"></div>
</div>    
<div class="box-2"></div>    
    
</div>    
    
<div class="item-container">
<div class="box-3"></div>    
<div class="box-3"></div>    
<div class="box-3"></div>    
<div class="box-3"></div>    
    
    
</div>    
    
    
    
    
    
    
    
    
</body>    
</html>
</doctype>
